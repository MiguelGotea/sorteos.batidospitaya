name: Deploy sorteos.batidospitaya.com

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via rsync
        env:
          SSH_KEY:  ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          DEST:     ${{ secrets.HOSTINGER_PATH_SORTEOS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null

          rsync -avz --delete \
            -e "ssh -p 65002 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.scripts/' \
            --exclude='img_bosquejos/' \
            --exclude='uploads/' \
            --exclude='*.md' \
            --exclude='*.sql' \
            ./ "$SSH_USER@$SSH_HOST:$DEST/"
